onlyBuiltDependencies:
  - "@sentry/cli"
  - bcrypt
  - canvas
  - core-js
  - unrs-resolver

# These deprecated transitive versions are pinned by current upstream packages
# (notably exceljs/canvas/jest). Allowlist them explicitly instead of forcing
# unsafe transitive overrides solely to silence install output.
allowedDeprecatedVersions:
  fstream: "1.0.12"
  glob: "7.2.3 || 10.5.0"
  inflight: "1.0.6"
  lodash.isequal: "4.5.0"
  prebuild-install: "7.1.3"
  rimraf: "2.7.1"
  uuid: "8.3.2"
  whatwg-encoding: "3.1.1"
