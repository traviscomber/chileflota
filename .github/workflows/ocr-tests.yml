name: OCR Safety Tests

on:
  pull_request:
    paths:
      - 'app/api/cron/document-ocr/**'
      - 'app/api/cron/pdf-ocr-backfill/**'
      - 'app/api/cron/f30-backfill/**'
      - 'app/api/company/documents/**/reprocess/**'
      - 'app/api/admin/ocr-review/**'
      - 'lib/ai-document-processor.ts'
      - 'lib/ai-dependency-availability.ts'
      - 'python_workers/**'
      - 'api/pdf-ocr.py'
      - 'requirements.txt'
      - '.python-version'
      - 'lib/f30-backfill-outcome.ts'
      - 'lib/fleet/**'
      - '__tests__/lib/plate-extractor.test.ts'
      - '__tests__/lib/ai-document-processor-inputs.test.ts'
      - '__tests__/lib/ai-dependency-availability.test.ts'
      - '__tests__/lib/f30-backfill-outcome.test.ts'
      - '.github/workflows/ocr-tests.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/cron/document-ocr/**'
      - 'app/api/cron/pdf-ocr-backfill/**'
      - 'app/api/cron/f30-backfill/**'
      - 'app/api/company/documents/**/reprocess/**'
      - 'app/api/admin/ocr-review/**'
      - 'lib/ai-document-processor.ts'
      - 'lib/ai-dependency-availability.ts'
      - 'python_workers/**'
      - 'api/pdf-ocr.py'
      - 'requirements.txt'
      - '.python-version'
      - 'lib/f30-backfill-outcome.ts'
      - 'lib/fleet/**'
      - '__tests__/lib/plate-extractor.test.ts'
      - '__tests__/lib/ai-document-processor-inputs.test.ts'
      - '__tests__/lib/ai-dependency-availability.test.ts'
      - '__tests__/lib/f30-backfill-outcome.test.ts'
      - '.github/workflows/ocr-tests.yml'

jobs:
  ocr-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm jest __tests__/lib/plate-extractor.test.ts __tests__/lib/ai-document-processor-inputs.test.ts __tests__/lib/ai-dependency-availability.test.ts __tests__/lib/f30-backfill-outcome.test.ts --runInBand
