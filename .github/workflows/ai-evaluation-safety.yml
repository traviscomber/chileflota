name: AI Evaluation Safety

on:
  pull_request:
    paths:
      - 'lib/ai-extraction-evaluation.ts'
      - '__tests__/ai-extraction-evaluation.test.ts'
      - '.github/workflows/ai-evaluation-safety.yml'

permissions:
  contents: read

jobs:
  ai-evaluation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm jest __tests__/ai-extraction-evaluation.test.ts --runInBand
