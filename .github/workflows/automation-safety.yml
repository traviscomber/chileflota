name: Automation Safety

on:
  pull_request:
    paths:
      - 'app/api/notifications/**'
      - 'lib/notification*.ts'
      - '__tests__/notification-delivery-safety.test.ts'
      - '.github/workflows/automation-safety.yml'

permissions:
  contents: read

jobs:
  notification-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run notification safety tests
        run: pnpm test -- --runInBand __tests__/notification-delivery-safety.test.ts
