name: Operational Clearance Safety

on:
  pull_request:
    paths:
      - 'lib/operational-clearance.ts'
      - 'lib/operational-clearance-authorization.ts'
      - 'app/api/company/operational-clearance/route.ts'
      - '__tests__/operational-clearance.test.ts'
      - '.github/workflows/operational-clearance-safety.yml'
  workflow_dispatch:

jobs:
  operational-clearance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm jest __tests__/operational-clearance.test.ts --runInBand
